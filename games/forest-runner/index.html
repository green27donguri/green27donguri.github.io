  <body>
    <main id="game" data-phase="loading" tabindex="0" aria-label="犬とどんぐり。画面のどこでもタップして遊べます。キーボードではスペースまたはエンター。">
      <section id="loading-screen" role="status" aria-live="polite" aria-label="ゲームの読み込み">
        <div class="loading-card">
          <svg class="loading-leaf" viewBox="0 0 32 40" aria-hidden="true"><path d="M30 1C13 2 2 12 3 25c0 4 2 7 5 9L2 39l3 1 6-7c12 2 19-12 19-32Z" fill="currentColor"/></svg>
          <p class="loading-eyebrow">FOREST RUN</p>
          <h2 id="loading-title">森を準備しています</h2>
          <p id="loading-detail">もうすぐ、出発。</p>
          <progress id="loading-progress" max="10" value="0" aria-label="森の読み込み"></progress>
          <ol class="loading-steps" aria-label="出発までの準備"><li data-loading-step="assets" class="active">森とふたり</li><li data-loading-step="motion">動きと音</li><li data-loading-step="graphics">出発</li></ol>
        </div>
      </section>
      <div id="scene" aria-hidden="true"></div>
      <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
        <symbol id="leaf-mark" viewBox="0 0 32 40"><path fill="currentColor" d="M30 1C13 2 2 12 3 25c0 4 2 7 5 9L2 39l3 1 6-7c12 2 19-12 19-32Z"/><path d="m8 31 15-20" stroke="var(--leaf-vein, #f7f2da)" stroke-width="1.5" fill="none"/></symbol>
        <symbol id="forward-mark" viewBox="0 0 24 32"><path fill="currentColor" d="M3 2 22 16 3 30l4-14Z"/></symbol>
      </defs></svg>
      <div class="edge-art" aria-hidden="true"></div>
      <button id="sound-toggle" data-ui-control type="button" aria-label="音を切る" aria-pressed="true"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M4 11h5l6-5v16l-6-5H4Z" fill="currentColor"/><path class="sound-waves" d="M19 9q6 5 0 10M22 5q10 9 0 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="sound-slash" d="m5 4 19 20" stroke="currentColor" stroke-width="2.5"/></svg></button>
      <header id="intro">
        <h1><span class="title-line"><span>犬と</span><svg><use href="#leaf-mark"/></svg></span><span class="title-line">どんぐり</span></h1>
        <p class="subtitle-ribbon">森を、ひとっ走り。</p>
      </header>
      <div id="run-progress" class="invisible" role="progressbar" aria-label="障害物の突破数" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0">
        <span id="run-count">00<span>/08</span></span><span id="run-leaves" class="leaf-progress" aria-hidden="true"></span>
      </div>
      <section id="message" class="is-visible" aria-live="polite" aria-atomic="true">
        <div class="result-heading"><strong id="message-english">LOADING</strong><h2 id="message-title">森を準備しています</h2></div>
        <div id="result-summary" class="result-summary" hidden>
          <div class="result-score" aria-label="スコア"><span>SCORE</span><b id="result-score">0</b></div>
          <span id="result-label">突破</span><b id="result-count">00/08</b><span id="result-leaves" class="leaf-progress" aria-hidden="true"></span>
        </div>
        <div id="result-actions">
          <div id="result-primary">
          <button id="primary-action" type="button" hidden><span id="action-english">START</span><svg aria-hidden="true"><use href="#forward-mark"/></svg><span id="action-japanese">タップでスタート</span></button>
          <div id="result-links" data-ui-control hidden>
            <button id="share-toggle" type="button" aria-label="結果をシェア" aria-haspopup="menu" aria-controls="share-menu" aria-expanded="false" title="シェア" hidden><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m-4 4 4-4 4 4M7 10H5v11h14V10h-2"/></svg></button>
            <a id="site-home" href="https://green27donguri.github.io/" aria-label="ホームへ" title="ホームへ"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8M5 10v11h14V10M10 21v-7h4v7"/></svg><span>ホームへ</span></a>
          </div>
          <div id="share-menu" role="menu" aria-label="共有先を選ぶ" data-ui-control hidden>
            <div class="share-destinations" role="group" aria-label="SNSのページを開く">
            <a id="share-x" role="menuitem" target="_blank" rel="noopener" aria-label="Xで結果をシェア"><span class="share-mark share-x-mark" aria-hidden="true">X</span>X</a>
            <a id="share-instagram" role="menuitem" target="_blank" rel="noopener" aria-label="投稿文をコピーしてInstagramを開く" aria-describedby="share-social-hint"><span class="share-mark share-instagram-mark" aria-hidden="true">◎</span>Instagram</a>
            <a id="share-tiktok" role="menuitem" target="_blank" rel="noopener" aria-label="投稿文をコピーしてTikTokを開く" aria-describedby="share-social-hint"><span class="share-mark share-tiktok-mark" aria-hidden="true">♪</span>TikTok</a>
            <a id="share-threads" role="menuitem" target="_blank" rel="noopener" aria-label="Threadsで結果をシェア"><span class="share-mark" aria-hidden="true">@</span>Threads</a>
            </div>
            <p id="share-social-hint" class="share-hint">Instagram・TikTokは投稿文をコピーして開きます。</p>
            <div class="share-divider" role="separator"></div>
            <button id="share-copy-link" type="button" role="menuitem"><span class="share-mark" aria-hidden="true">↗</span>リンクをコピー</button>
            <a id="save-image" role="menuitem" aria-label="結果画像を保存" aria-disabled="true" tabindex="-1"><span class="share-mark" aria-hidden="true">↓</span><span id="save-image-label">画像を準備中</span></a>
            <button id="share-copy" role="menuitem" type="button" aria-label="タグ付きの投稿文をコピー"><span class="share-mark" aria-hidden="true">≡</span>投稿文をコピー</button>
          </div>
          </div>
          <div id="share-manual" data-ui-control hidden><input id="share-text" type="text" readonly aria-label="コピーする結果とゲームURL"><button id="share-back" type="button" aria-label="共有ボタンに戻る">戻る</button></div>
          <p id="share-status" role="status" aria-live="polite"></p>
          <p id="message-detail">もうすぐ、出発。</p>
        </div>
      </section>
      <div id="tap-guide" class="invisible" aria-hidden="true">
        <div id="rhythm">
          <div class="tap-target"></div><div id="approach-ring"></div><svg class="target-leaf"><use href="#leaf-mark"/></svg>
          <span id="tap-label">TAP</span>
        </div>
        <p id="cue" role="status" aria-live="polite"></p>
      </div>
      <div id="tap-acknowledgment" aria-hidden="true"><div id="tap-press"></div><div id="tap-echo"></div></div>
      <div id="tap-feedback" class="invisible" role="status" aria-live="polite" aria-atomic="true"><strong></strong><span></span><svg aria-hidden="true"><use href="#leaf-mark"/></svg></div>
    </main>
    <noscript>遊ぶにはJavaScriptを有効にしてください。</noscript>

  </body>
</html>
