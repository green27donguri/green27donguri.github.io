<style>
.thanks-shell {
  max-width: 580px; margin: 0 auto;
  padding: 120px 24px 100px;
  text-align: center;
  position: relative;
}
.thanks-shell .acorn-illust {
  width: 100px; height: 100px;
  margin: 0 auto 36px;
  animation: gentle-bob 3.5s ease-in-out infinite;
}
@keyframes gentle-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}
.thanks-shell h1 { font-size: clamp(28px, 4vw, 36px); margin-bottom: 24px; letter-spacing: -1px; line-height: 1.2; }
.thanks-shell p { color: var(--text-secondary); font-size: 15px; line-height: 1.9; margin: 0 0 8px; }
.thanks-shell .home-cta { margin-top: 56px; }
@media (max-width: 600px) {
  .thanks-shell { padding: 80px 24px 80px; }
}
</style>
<script src="js/config.js"></script>
<script src="js/analytics.js"></script>
</head>
<body class="scene-calm">

<div class="scene" aria-hidden="true"></div>

<div class="sprite-track" aria-hidden="true">
  <div class="sprite-pos shiba"><div class="sprite-stage"><div class="sprite sprite-shiba"></div></div></div>
  <div class="sprite-pos acorn"><div class="acorn-physics"><div class="sprite-stage"><div class="sprite sprite-acorn"></div></div></div></div>
</div>

<div class="app">
  <main class="thanks-shell">

      <path d="M44 68 Q 50 73 56 68"/>
    </svg>

    <h1 class="intro-build" data-delay="2">届きました。<br>ありがとうございます。</h1>
